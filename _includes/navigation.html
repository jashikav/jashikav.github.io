<header class="border-b border-brand-100 bg-white">
  <nav aria-label="Main navigation" class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6">
    <a href="{{ '/' | relative_url }}" class="flex items-center gap-3 font-semibold text-brand-950">
      <img src="{{ '/assets/images/logo3.jpg' | relative_url }}" alt="Vans Bookkeeping home" width="64" height="64" class="rounded-xl">
      <span class="text-lg">Vans Bookkeeping</span>
    </a>
    <ul class="flex w-full flex-wrap gap-1 sm:w-auto" role="list">
      {% for item in site.data.menu %}
      <li><a class="nav-link block" {% if item.link == page.url %}aria-current="page"{% endif %} href="{{ item.link | relative_url }}">{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
