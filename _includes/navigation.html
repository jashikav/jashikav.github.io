<header class="site-header">
  <nav aria-label="Main navigation" class="container navigation">
    <a href="{{ '/' | relative_url }}" class="brand" aria-label="VANS Bookkeeping home">
      <img src="{{ '/assets/images/logo.svg' | relative_url }}" alt="" width="48" height="48">
      <span>VANS Bookkeeping<small>LOCAL ROOTS. CLEARER NUMBERS.</small></span>
    </a>
    <ul class="nav-menu" role="list">
      {% for item in site.data.menu %}
      <li><a class="nav-link" {% if item.link == page.url %}aria-current="page"{% endif %} href="{{ item.link | relative_url }}">{{ item.title }}</a></li>
      {% endfor %}
    </ul>
    <a href="{{ '/contact/' | relative_url }}" class="button button-small nav-cta">Let’s talk {% include icon.html name="arrow" %}</a>
  </nav>
</header>
