<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="{{ site.color-scheme }}">
  <meta name="site-version" content="{{ site.data.version.version }}">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <link rel="icon" type="image/jpeg" href="{{ '/assets/images/logo3.jpg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.data.version.version }}">
</head>
