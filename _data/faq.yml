- question: Where do you work with businesses?
  answer: We’re based in Vacaville and serve small businesses across Northern California, including Solano County, the Sacramento region, and the Bay Area. We also offer virtual bookkeeping services nationwide.
- question: Do you work with QuickBooks Online?
  answer: Yes. We use QuickBooks Online to organize transactions, manage records, and provide financial reports. We’ll discuss your current setup and what support you need during our first conversation.
- question: Can you work with my CPA?
  answer: Yes. We help bridge the gap between your day-to-day bookkeeping and your CPA by maintaining organized records and providing financial reports they can use.
- question: How much does bookkeeping cost?
  answer: Your bookkeeping needs depend on your transaction volume, accounts, and the services you choose. Get in touch so we can discuss your business and a scope that fits before you move forward.
- question: What should I bring to the first conversation?
  answer: Come ready to share a little about your business, the accounting software you use, and the bookkeeping tasks you need help with. There’s no need to send financial documents before we’ve spoken.
